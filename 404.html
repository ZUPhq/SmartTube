<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pagina nu există — smarttube</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="media/logos/favicon.png" />
<link rel="stylesheet" href="styles.css" />
<script>try{
  if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');
  var n=navigator,c=n.connection||{};
  var slow=c.saveData===true||/^(slow-2g|2g|3g)$/.test(c.effectiveType||'');
  var lp=matchMedia('(prefers-reduced-motion:reduce)').matches||slow
    ||((n.hardwareConcurrency||0)>0&&n.hardwareConcurrency<=2)
    ||((n.deviceMemory||0)>0&&n.deviceMemory<=2)
    ||Math.min(screen.width,screen.height)<=360;
  window.LOWPOWER=!!lp;
  if(lp){var d=document.documentElement;d.className+=(d.className?' ':'')+'lp-root';}
}catch(e){}</script>
<!-- pagină standalone, fără partials/db: trebuie să se randeze chiar și când restul e stricat.
     funcționează automat pe hosturi care servesc /404.html (GitHub Pages, Netlify, Vercel). -->
</head>
<body>

<header class="phead" style="min-height:72vh;display:grid;place-items:center">
  <span class="glow"></span>
  <div class="phead-in" style="position:relative;z-index:2">
    <p class="eyebrow">Eroare 404</p>
    <h1 class="h1">Pagina asta nu există.</h1>
    <p class="lead" style="margin-top:14px">Linkul e greșit sau pagina a fost mutată între timp. Cursurile sunt în continuare aici.</p>
    <div class="tile-cta">
      <a href="cursuri.html" class="btn btn-mint">Vezi cursurile</a>
      <a href="index.html" class="link">Pagina principală</a>
    </div>
  </div>
</header>

</body>
</html>
